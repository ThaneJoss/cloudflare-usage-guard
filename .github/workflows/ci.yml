name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:bundle
      - run: WORKERS_CI=1 pnpm build
      - run: pnpm worker:types:check
      - run: pnpm worker:dry-run
      - run: pnpm audit:dependencies
      - name: 安装 Chromium
        run: pnpm exec playwright install chromium
      - name: 验证桌面与移动端浏览器交互及无障碍
        run: pnpm test:e2e
      - name: 保存浏览器检查报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
